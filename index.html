<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>目指せ！！コンサルマスター！！</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React / ReactDOM / Babel (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }

    .logo-text {
      background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4));
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .float-anim {
      animation: floating 3s ease-in-out infinite;
    }

    @keyframes floating {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const LoginScreen = ({ onLogin }) => {
      const [staffId, setStaffId] = useState('');
      const [error, setError] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        if (staffId.startsWith('0')) {
          setError('※担当者番号は0から始まらない数字で入力してください。');
          return;
        }
        if (!staffId || isNaN(staffId) || staffId < 1 || staffId > 999999) {
          setError('※1から999999までの数字を入力してください。');
          return;
        }
        onLogin(staffId);
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#002868] to-[#004098] p-4 relative overflow-hidden">
          {/* 背景の装飾 */}
          <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
          <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-yellow-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>

          <div className="z-10 w-full max-w-lg flex flex-col items-center">
            {/* ロゴ部分 */}
            <div className="mb-10 text-center float-anim flex flex-col items-center w-full">
              <svg className="w-16 h-16 text-yellow-400 mb-2 drop-shadow-md" fill="currentColor" viewBox="0 0 24 24">
                <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z" />
              </svg>
              <h1 className="font-black logo-text tracking-wider mb-2 flex flex-col items-center gap-1">
                <span className="text-2xl md:text-3xl lg:text-4xl">目指せ！！</span>
                <span className="text-4xl md:text-5xl lg:text-6xl whitespace-nowrap">コンサルマスター！！</span>
              </h1>
              <p className="text-blue-200 text-sm md:text-base font-bold tracking-widest uppercase mt-2">
                - Nojima Consultant Master -
              </p>
            </div>

            {/* ログインフォーム */}
            <div className="glass-card w-full rounded-3xl p-8 border border-white/20">
              <form onSubmit={handleLogin} className="space-y-6">
                <div>
                  <label className="block text-[#004098] font-bold mb-2 text-lg">
                    担当者番号でログイン
                  </label>
                  <p className="text-sm text-red-500 mb-2 font-bold">※0を抜いた数字を入力してください</p>
                  <input
                    type="number"
                    value={staffId}
                    onChange={(e) => setStaffId(e.target.value)}
                    placeholder="例: 12345"
                    className="w-full px-4 py-4 text-lg bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#004098] focus:ring-2 focus:ring-blue-200 transition-all text-center font-bold text-gray-700"
                  />
                </div>
                {error && <p className="text-red-500 text-sm font-bold text-center">{error}</p>}
                <button
                  type="submit"
                  className="w-full py-4 bg-gradient-to-r from-[#004098] to-[#0052c2] text-white rounded-xl font-bold text-lg shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all"
                >
                  ログインして開始
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    const emptyForm = {
      maker: '', name: '', model: '',
      feature1: '', feature2: '', feature3: '',
      talk1: '', talk2: '', talk3: '',
      feedbackTarget: ''
    };

    const RegistrationForm = ({ onSubmit, currentUser }) => {
      const [formData, setFormData] = useState(emptyForm);

      const handleSubmit = (e) => {
        e.preventDefault();
        onSubmit({ ...formData, authorId: currentUser, feedbacks: [], id: Date.now() });
        alert('登録が完了しました！経験値（レベル）が上がりました！');
        setFormData(emptyForm);
      };

      return (
        <div className="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
          <h2 className="text-2xl font-bold text-[#004098] mb-6 border-b-2 border-[#004098] pb-2">商品知識を登録する</h2>
          <form onSubmit={handleSubmit} className="space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">メーカー名</label>
                <input required type="text" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" value={formData.maker} onChange={e => setFormData({...formData, maker: e.target.value})} />
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">商品名</label>
                <input required type="text" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">商品型番</label>
                <input required type="text" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" value={formData.model} onChange={e => setFormData({...formData, model: e.target.value})} />
              </div>
            </div>

            {[1, 2, 3].map(num => (
              <div key={num} className="bg-blue-50 p-4 rounded-xl">
                <h3 className="font-bold text-[#004098] mb-3">機能とトーク {num}</h3>
                <div className="space-y-3">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">商品機能{num}</label>
                    <input required type="text" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="例: 独自の省エネセンサー搭載" value={formData[`feature${num}`]} onChange={e => setFormData({...formData, [`feature${num}`]: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">機能からお客様へのトーク（使用効果{num}）</label>
                    <textarea required rows="2" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="例: こちらのセンサーにより、毎月の電気代が約〇〇円お得になるんですよ！" value={formData[`talk${num}`]} onChange={e => setFormData({...formData, [`talk${num}`]: e.target.value})}></textarea>
                  </div>
                </div>
              </div>
            ))}

            <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-200">
              <label className="block text-sm font-bold text-gray-800 mb-2">フィードバックを依頼する（任意）</label>
              <p className="text-xs text-gray-600 mb-2">アドバイスが欲しい担当者の番号を入力してください。相手にのみ通知されます。</p>
              <input type="number" placeholder="担当者番号 (例: 123)" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none" value={formData.feedbackTarget} onChange={e => setFormData({...formData, feedbackTarget: e.target.value})} />
            </div>

            <button type="submit" className="w-full py-4 bg-[#004098] hover:bg-blue-800 text-white font-bold rounded-xl shadow-md transition-colors text-lg">
              登録してレベルアップ！
            </button>
          </form>
        </div>
      );
    };

    const SearchView = ({ products }) => {
      const [query, setQuery] = useState('');

      const filtered = products.filter(p =>
        p.name.includes(query) || p.model.includes(query) || p.maker.includes(query)
      );

      return (
        <div className="max-w-5xl mx-auto space-y-6">
          <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex gap-4 items-center">
            <svg className="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input
              type="text"
              placeholder="メーカー名、商品名、型番で検索..."
              className="flex-1 text-lg outline-none"
              value={query}
              onChange={e => setQuery(e.target.value)}
            />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {filtered.map(p => (
              <div key={p.id} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                <div className="flex justify-between items-start mb-4">
                  <div>
                    <span className="text-xs font-bold bg-blue-100 text-[#004098] px-2 py-1 rounded mb-2 inline-block">{p.maker}</span>
                    <h3 className="text-xl font-bold text-gray-800">{p.name}</h3>
                    <p className="text-gray-500 text-sm">型番: {p.model}</p>
                  </div>
                  <span className="text-xs text-gray-400">作成者: {p.authorId}</span>
                </div>
                <div className="space-y-4">
                  {[1, 2, 3].map(num => (
                    <div key={num} className="bg-gray-50 p-3 rounded-lg text-sm">
                      <p className="font-bold text-[#004098] mb-1">機能{num}: {p[`feature${num}`]}</p>
                      <p className="text-gray-700">🗣️ {p[`talk${num}`]}</p>
                    </div>
                  ))}
                </div>
              </div>
            ))}
            {filtered.length === 0 && (
              <div className="col-span-full text-center text-gray-500 py-10">見つかりませんでした。</div>
            )}
          </div>
        </div>
      );
    };

    const MyPage = ({ products, currentUser }) => {
      const myProducts = products.filter(p => p.authorId === currentUser);
      const myLevel = myProducts.length + 1;

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-gradient-to-r from-[#004098] to-blue-600 rounded-2xl p-8 text-white shadow-lg flex items-center justify-between">
            <div>
              <p className="text-blue-200 font-bold mb-1">担当者番号: {currentUser}</p>
              <h2 className="text-3xl font-black">マイページ</h2>
            </div>
            <div className="text-center">
              <p className="text-sm font-bold text-blue-200">現在のレベル</p>
              <div className="text-5xl font-black text-yellow-400 drop-shadow-md">Lv.{myLevel}</div>
            </div>
          </div>

          <h3 className="text-xl font-bold text-gray-800 mt-8 mb-4 border-l-4 border-[#004098] pl-3">登録した商品データ</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {myProducts.map(p => (
              <div key={p.id} className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <span className="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded">{p.maker}</span>
                <h4 className="font-bold text-lg mt-2">{p.name}</h4>
                <p className="text-sm text-gray-500 mb-3">{p.model}</p>
                <div className="bg-yellow-50 p-3 rounded text-sm text-gray-700">
                  フィードバック依頼先: {p.feedbackTarget || 'なし'}
                </div>
              </div>
            ))}
            {myProducts.length === 0 && <p className="text-gray-500">まだ登録データがありません。</p>}
          </div>
        </div>
      );
    };

    const RankingView = ({ products }) => {
      // ユーザーごとの登録数を集計
      const userCounts = products.reduce((acc, p) => {
        acc[p.authorId] = (acc[p.authorId] || 0) + 1;
        return acc;
      }, {});

      const ranking = Object.entries(userCounts)
        .map(([id, count]) => ({ id, level: count + 1 }))
        .sort((a, b) => b.level - a.level);

      const getMedalColor = (index) => {
        if (index === 0) return 'bg-yellow-400 text-yellow-900';
        if (index === 1) return 'bg-gray-300 text-gray-800';
        if (index === 2) return 'bg-amber-600 text-white';
        return 'bg-blue-100 text-blue-800';
      };

      return (
        <div className="max-w-2xl mx-auto">
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div className="bg-[#004098] p-6 text-white text-center">
              <h2 className="text-2xl font-black tracking-wider">マスターランキング</h2>
              <p className="text-sm text-blue-200 mt-1">知識を共有してトップを目指そう！</p>
            </div>
            <div className="p-0">
              {ranking.map((user, index) => (
                <div key={user.id} className="flex items-center p-4 border-b border-gray-100 hover:bg-gray-50 transition-colors">
                  <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black mr-4 ${getMedalColor(index)}`}>
                    {index + 1}
                  </div>
                  <div className="flex-1">
                    <p className="text-sm text-gray-500 font-bold">担当者番号</p>
                    <p className="text-lg font-bold text-gray-800">{user.id}</p>
                  </div>
                  <div className="text-right">
                    <p className="text-sm text-gray-500 font-bold">レベル</p>
                    <p className="text-2xl font-black text-[#004098]">Lv.{user.level}</p>
                  </div>
                </div>
              ))}
              {ranking.length === 0 && <p className="p-8 text-center text-gray-500">まだランキングデータがありません。</p>}
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState('search');
      const [products, setProducts] = useState(() => {
        try {
          const saved = localStorage.getItem('consulMasterData');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      // データ保存（ブラウザのローカルストレージ）
      useEffect(() => {
        try {
          localStorage.setItem('consulMasterData', JSON.stringify(products));
        } catch (e) {}
      }, [products]);

      const handleAddProduct = (newProduct) => {
        setProducts([newProduct, ...products]);
      };

      if (!currentUser) {
        return <LoginScreen onLogin={setCurrentUser} />;
      }

      const myLevel = products.filter(p => p.authorId === currentUser).length + 1;

      return (
        <div className="min-h-screen bg-blue-50/50">
          {/* ヘッダー */}
          <header className="bg-[#004098] text-white p-4 shadow-md sticky top-0 z-50">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <h1 className="text-xl md:text-2xl font-black logo-text flex items-center gap-2">
                <svg className="w-6 h-6 text-yellow-400" fill="currentColor" viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5z" /></svg>
                コンサルマスター
              </h1>
              <div className="flex items-center gap-4 text-sm md:text-base">
                <span className="font-bold">担当者: {currentUser}</span>
                <span className="bg-yellow-400 text-yellow-900 px-3 py-1 rounded-full font-black">Lv.{myLevel}</span>
                <button onClick={() => setCurrentUser(null)} className="text-blue-200 hover:text-white text-sm underline">ログアウト</button>
              </div>
            </div>
          </header>

          {/* ナビゲーションタブ */}
          <div className="bg-white border-b shadow-sm sticky top-[68px] z-40">
            <div className="max-w-6xl mx-auto flex overflow-x-auto">
              {[
                { id: 'search', label: '商品検索' },
                { id: 'register', label: '商品登録' },
                { id: 'mypage', label: 'マイページ' },
                { id: 'ranking', label: 'ランキング' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex-1 py-4 px-6 font-bold text-center whitespace-nowrap border-b-4 transition-colors ${
                    activeTab === tab.id ? 'border-[#004098] text-[#004098]' : 'border-transparent text-gray-500 hover:text-gray-800 hover:bg-gray-50'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </div>

          {/* メインコンテンツエリア */}
          <main className="max-w-6xl mx-auto p-4 md:p-8">
            {activeTab === 'register' && <RegistrationForm onSubmit={handleAddProduct} currentUser={currentUser} />}
            {activeTab === 'search' && <SearchView products={products} />}
            {activeTab === 'mypage' && <MyPage products={products} currentUser={currentUser} />}
            {activeTab === 'ranking' && <RankingView products={products} />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
